name: BigRemote
options:
  bundleIdPrefix: com.danielvm
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  BigRemote:
    type: application
    platform: macOS
    sources:
      - path: Sources/BigRemote
        excludes:
          - Info.plist
          - BigRemote.entitlements
    info:
      path: Sources/BigRemote/Info.plist
      properties:
        CFBundleName: Big Remote
        CFBundleDisplayName: Big Remote
        CFBundleDevelopmentRegion: pt-BR
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Daniel VM"
        NSLocalNetworkUsageDescription: "O Big Remote controla as TVs Samsung, Sony e LG da sua rede local (controle remoto, Modo Arte e Wake-on-LAN)."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Sources/BigRemote/BigRemote.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_NAME: Big Remote
        PRODUCT_MODULE_NAME: BigRemote
        PRODUCT_BUNDLE_IDENTIFIER: com.danielvm.BigRemote
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/BigRemote/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/BigRemote/BigRemote.entitlements
  BigRemoteiOS:
    type: application
    platform: iOS
    # Same AppModel, TV clients and reusable views as the Mac app; only the
    # macOS entry point and macOS-only windows are left out.
    sources:
      - path: Sources/BigRemote
        excludes:
          - Info.plist
          - BigRemote.entitlements
          - App/BigRemoteApp.swift
          - Views/MainWindowView.swift
          - Views/MenuBarRemoteView.swift
          - Views/SettingsView.swift
          - Views/PresetEditorView.swift
          - Views/SmartThingsPanelView.swift
      - Sources/BigRemoteiOS
    settings:
      base:
        PRODUCT_NAME: Big Remote
        PRODUCT_MODULE_NAME: BigRemoteiOS
        PRODUCT_BUNDLE_IDENTIFIER: com.danielvm.BigRemoteiOS
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Big Remote
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "O Big Remote controla as TVs Samsung, Sony e LG da sua rede local, direto do iPhone."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  BigRemoteTests:
    type: bundle.unit-test
    platform: macOS
    # No test host: the tests compile the pure model/protocol files directly,
    # so running them never launches the app or touches the network.
    sources:
      - Tests/BigRemoteTests
      - Sources/BigRemote/Models
      - Sources/BigRemote/Services/Protocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielvm.BigRemoteTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BigRemoteiOS:
    build:
      targets:
        BigRemoteiOS: all
    archive:
      config: Release
  BigRemote:
    build:
      targets:
        BigRemote: all
        BigRemoteTests: [test]
    test:
      targets:
        - BigRemoteTests
    run:
      config: Debug
