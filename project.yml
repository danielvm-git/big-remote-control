name: BigRemote
options:
  bundleIdPrefix: com.danielvm
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  BigRemote:
    type: application
    platform: macOS
    sources:
      - path: Sources/BigRemote
        excludes:
          - Info.plist
          - BigRemote.entitlements
    info:
      path: Sources/BigRemote/Info.plist
      properties:
        CFBundleName: Big Remote
        CFBundleDisplayName: Big Remote
        CFBundleDevelopmentRegion: pt-BR
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Daniel VM"
        NSLocalNetworkUsageDescription: "O Big Remote controla as TVs Samsung da sua rede local (controle remoto, Modo Arte e Wake-on-LAN)."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Sources/BigRemote/BigRemote.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_NAME: Big Remote
        PRODUCT_MODULE_NAME: BigRemote
        PRODUCT_BUNDLE_IDENTIFIER: com.danielvm.BigRemote
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/BigRemote/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/BigRemote/BigRemote.entitlements
  BigRemoteTests:
    type: bundle.unit-test
    platform: macOS
    # No test host: the tests compile the pure model/protocol files directly,
    # so running them never launches the app or touches the network.
    sources:
      - Tests/BigRemoteTests
      - Sources/BigRemote/Models
      - Sources/BigRemote/Services/Protocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielvm.BigRemoteTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BigRemote:
    build:
      targets:
        BigRemote: all
        BigRemoteTests: [test]
    test:
      targets:
        - BigRemoteTests
    run:
      config: Debug
